<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Project X Private Access</title>
    <!-- PWA Configurations -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Project X">
    <link rel="apple-touch-icon" href="icons/logo-x.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="css/style.css?v=1.0.11">
</head>

<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Background Ambient Glows -->
    <div
        class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-blue-900/20 blur-[120px] pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-900/20 blur-[120px] pointer-events-none">
    </div>

    <!-- Login Container -->
    <!-- TEST LOGIN INFO FOR DEVELOPMENT:
         Email: ris2k29@gmail.com
         Password: 787898
    -->
    <div class="w-full max-w-md z-10 transition-all duration-300">
        <!-- Logo / Title -->
        <div class="text-center mb-8">
            <span
                class="inline-block px-3 py-1 bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-[10px] font-black uppercase tracking-widest rounded-lg shadow-md mb-3">
                Private Access System
            </span>
            <h1
                class="text-3xl md:text-4xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-400">
                Project X
            </h1>
            <p class="text-slate-500 font-bold text-xs md:text-sm tracking-wide mt-2">
                Sign in to access your tracking workspace
            </p>
        </div>

        <!-- Glassmorphism Card -->
        <div class="glass-card rounded-[2rem] p-6 md:p-8 space-y-6">
            <!-- Access Denied / Error Notification -->
            <div id="error-banner"
                class="hidden flex items-start gap-3 bg-rose-500/10 border border-rose-500/20 p-4 rounded-2xl text-rose-400 text-xs font-semibold animate-fade-in transition-all">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                    </path>
                </svg>
                <span id="error-message">Access denied. Project X is private.</span>
            </div>




            <!-- Form -->
            <form id="login-form" class="space-y-5">
                <div class="space-y-2">
                    <label for="email"
                        class="block text-[10px] uppercase font-black tracking-widest text-slate-400">Email
                        Address</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="name@example.com"
                        class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-sm placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 glowing-input transition-all">
                </div>

                <div class="space-y-2">
                    <label for="password"
                        class="block text-[10px] uppercase font-black tracking-widest text-slate-400">Password</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"
                        class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-sm placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 glowing-input transition-all">
                </div>

                <button type="submit" id="btn-submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black text-xs uppercase tracking-widest py-4 rounded-xl transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-2">
                    <span>Authenticate</span>
                    <svg id="spinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </button>
            </form>
        </div>

        <div class="text-center mt-6">
            <p class="text-[10px] font-black uppercase tracking-widest text-slate-600">
                Unauthorized access is strictly prohibited.
            </p>
        </div>
    </div>

    <!-- Script Logic -->
    <script src="js/utils.js?v=1.0.11"></script>
    <script src="js/state.js?v=1.0.11"></script>
    <script src="js/firebase.js?v=1.0.11"></script>
    <script src="js/timer.js?v=1.0.11"></script>
    <script src="js/script.js?v=1.0.11"></script>
</body>

</html>
